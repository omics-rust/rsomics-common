[package]
name = "rsomics-common"
version = "0.10.0"
description = "Shared rsomics error, exit-code, and machine-output contracts"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-common"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
